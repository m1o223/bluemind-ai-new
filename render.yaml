services:
  - type: web
    name: bluemind-ai-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api
      - key: CORS_ORIGIN
        value: https://bluemind-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://bluemind-frontend.vercel.app
      - key: BACKEND_PUBLIC_URL
        value: https://bluemind-ai-new.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DEV_MODE
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_REJECT_UNAUTHORIZED
        value: "true"
      - key: EMAIL_SEND_TIMEOUT_MS
        value: "12000"
      - key: REMINDER_SCHEDULER_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://bluemind-ai-new.onrender.com/api/auth/google/callback
